{% extends "base.html" %}

{% block content %}
<div class="auth-form">
    <h2>Login</h2>
    <form method="POST">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Login</button>
        <p style="margin-top: 1rem; text-align: center; color: var(--secondary-text);">
            Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--accent-color);">Register</a>
        </p>
    </form>
</div>
{% endblock %}
