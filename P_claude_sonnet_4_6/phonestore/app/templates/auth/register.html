{% extends "base.html" %}
{% block title %}Create Account — PhoneStore{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">⚡ PhoneStore</div>
    <h1 class="auth-title">Create your account</h1>
    <p class="auth-subtitle">Join thousands of happy customers</p>

    <form method="POST" action="{{ url_for('auth.register') }}" id="register-form">
      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <input type="text" id="name" name="name" class="form-control"
               placeholder="John Doe" value="{{ name or '' }}" required autofocus />
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control"
               placeholder="john@example.com" value="{{ email or '' }}" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control"
               placeholder="Min. 8 characters" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control"
               placeholder="Repeat your password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-full" style="margin-top:8px;">
        Create Account →
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="{{ url_for('auth.login') }}">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
