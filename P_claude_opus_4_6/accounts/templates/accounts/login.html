{% extends "base.html" %}

{% block title %}Login — PhoneGear{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-container">
        <div class="auth-card">
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Log in to your PhoneGear account</p>

            {% if form.errors %}
            <div class="alert alert-error">
                Invalid username or password. Please try again.
            </div>
            {% endif %}

            <form method="post" class="auth-form" id="login-form">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_username" class="form-label">Username</label>
                    <input type="text" name="username" id="id_username" class="form-input" placeholder="Username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="id_password" class="form-label">Password</label>
                    <input type="password" name="password" id="id_password" class="form-input" placeholder="Password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="login-btn">Log In</button>
            </form>

            <p class="auth-footer">
                Don't have an account? <a href="{% url 'accounts:register' %}">Sign up</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
